<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Minimalist Burger Icon -->
  
  <!-- Outer Circle Background -->
  <circle cx="600" cy="600" r="450" fill="#3D5CFF"/>
  
  <!-- Inner Circle for contrast -->
  <circle cx="600" cy="600" r="380" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- Stylized Burger -->
  <!-- Top Bun -->
  <rect x="350" y="420" width="500" height="60" rx="30" fill="#FFB800"/>
  <ellipse cx="600" cy="425" rx="250" ry="20" fill="#FFC933"/>
  
  <!-- Lettuce Layer -->
  <rect x="370" y="490" width="460" height="40" rx="5" fill="#4CAF50"/>
  
  <!-- Cheese Layer -->
  <rect x="380" y="540" width="440" height="35" rx="5" fill="#FFD700"/>
  
  <!-- Patty -->
  <rect x="360" y="585" width="480" height="50" rx="8" fill="#8B4513"/>
  
  <!-- Tomato Slices -->
  <circle cx="480" cy="645" r="25" fill="#FF6B6B"/>
  <circle cx="600" cy="645" r="25" fill="#FF6B6B"/>
  <circle cx="720" cy="645" r="25" fill="#FF6B6B"/>
  
  <!-- Bottom Bun -->
  <rect x="350" y="680" width="500" height="60" rx="30" fill="#FFB800"/>
  <ellipse cx="600" cy="740" rx="250" ry="15" fill="#E69500"/>
  
  <!-- Letter B Badge (Optional - can be removed) -->
  <circle cx="600" cy="600" r="120" fill="#FFFFFF" opacity="0.15"/>
  <text x="600" y="650" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
</svg>
